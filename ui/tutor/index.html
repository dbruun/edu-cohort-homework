<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homework Tutor</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --accent:#2563eb; --user:#2563eb; --bot:#eef1f6; --text:#1b1b1b; --muted:#667; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:.85rem 1.25rem; background:var(--card); border-bottom:1px solid #e3e8ef; display:flex; align-items:center; gap:.75rem; }
    header h1 { font-size:1.05rem; margin:0; }
    header .badge { font-size:.72rem; color:var(--muted); border:1px solid #dde3ec; border-radius:999px; padding:.1rem .55rem; }
    main { flex:1; overflow-y:auto; padding:1.25rem; }
    .wrap { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:.75rem; }
    .msg { padding:.7rem .95rem; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; max-width:85%; }
    .msg.user { background:var(--user); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
    .msg.bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
    .msg.error { background:#fdecec; color:#a1160a; align-self:flex-start; border:1px solid #f5b5ae; }
    .role { font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:0 .3rem .1rem; }
    .row { display:flex; flex-direction:column; }
    .row.user { align-items:flex-end; }
    footer { padding:.85rem 1.25rem; background:var(--card); border-top:1px solid #e3e8ef; }
    form { max-width:760px; margin:0 auto; display:flex; gap:.6rem; }
    textarea { flex:1; resize:none; padding:.7rem .85rem; border:1px solid #cdd5e0; border-radius:12px; font:inherit; min-height:46px; max-height:160px; }
    button { padding:0 1.15rem; border:none; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .cfg { max-width:760px; margin:.4rem auto 0; font-size:.72rem; color:var(--muted); }
    .cfg input { border:1px solid #dde3ec; border-radius:8px; padding:.15rem .4rem; font:inherit; width:min(520px,70vw); }
    .cursor::after { content:"▍"; animation:blink 1s steps(2) infinite; color:var(--muted); }
    @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }
  </style>
</head>
<body>
  <header>
    <h1>Homework Tutor</h1>
    <span class="badge">Microsoft Agent Framework · AG-UI · gpt-5.4</span>
  </header>
  <main>
    <div class="wrap" id="messages"></div>
  </main>
  <footer>
    <form id="form">
      <textarea id="input" placeholder="Ask for help with a homework problem…" autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="cfg">Agent AG-UI endpoint: <input id="agentUrl" spellcheck="false" /></div>
  </footer>

  <script>
    // --- Config: agent AG-UI endpoint (override with ?agent=<url>) -----------
    const DEFAULT_AGENT = 'https://ca-homework-agent-cohortltia2.delightfulplant-bfdae994.northcentralus.azurecontainerapps.io/';
    const params = new URLSearchParams(location.search);
    let agentUrl = params.get('agent') || DEFAULT_AGENT;
    const agentUrlInput = document.getElementById('agentUrl');
    agentUrlInput.value = agentUrl;
    agentUrlInput.addEventListener('change', () => { agentUrl = agentUrlInput.value.trim(); });

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // Full conversation history sent to the agent each turn (AG-UI messages array).
    const history = [];
    const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

    function addMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'row ' + (role === 'user' ? 'user' : '');
      const label = document.createElement('div');
      label.className = 'role';
      label.textContent = role === 'user' ? 'You' : role === 'error' ? 'Error' : 'Tutor';
      const bubble = document.createElement('div');
      bubble.className = 'msg ' + (role === 'user' ? 'user' : role === 'error' ? 'error' : 'bot');
      bubble.textContent = text;
      row.appendChild(label);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.parentElement.scrollTop = messagesEl.parentElement.scrollHeight;
      return bubble;
    }

    async function send(text) {
      addMessage('user', text);
      history.push({ id: uuid(), role: 'user', content: text });

      const bubble = addMessage('assistant', '');
      bubble.classList.add('cursor');
      let full = '';

      const body = {
        threadId: window.__threadId || (window.__threadId = uuid()),
        runId: uuid(),
        messages: history,
        tools: [], context: [], state: {}, forwardedProps: {}
      };

      try {
        const res = await fetch(agentUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
          body: JSON.stringify(body)
        });
        if (!res.ok || !res.body) {
          bubble.classList.remove('cursor');
          bubble.parentElement.remove();
          addMessage('error', `Agent returned ${res.status}. ${await res.text().catch(() => '')}`);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        // Parse Server-Sent Events: records separated by a blank line, "data:" payloads are AG-UI events.
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buffer.indexOf('\n\n')) !== -1) {
            const record = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            for (const line of record.split('\n')) {
              if (!line.startsWith('data:')) continue;
              const json = line.slice(5).trim();
              if (!json) continue;
              let evt;
              try { evt = JSON.parse(json); } catch { continue; }
              if (evt.type === 'TEXT_MESSAGE_CONTENT' && typeof evt.delta === 'string') {
                full += evt.delta;
                bubble.textContent = full;
                messagesEl.parentElement.scrollTop = messagesEl.parentElement.scrollHeight;
              } else if (evt.type === 'RUN_ERROR') {
                addMessage('error', evt.message || 'Agent run error.');
              }
            }
          }
        }
      } catch (err) {
        bubble.parentElement.remove();
        addMessage('error', 'Could not reach the agent: ' + err.message);
        return;
      } finally {
        bubble.classList.remove('cursor');
      }

      if (full) history.push({ id: uuid(), role: 'assistant', content: full });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendBtn.disabled = true;
      try { await send(text); } finally { sendBtn.disabled = false; input.focus(); }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
  </script>
</body>
</html>
