<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseWise Professor | Teaching settings and course materials</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }
      html[data-theme="light"] {
        --cp-bg: #f7f8f9;
        --cp-bg-elevated: #f5f7f8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #edf2f6;
        --cp-border: #d3dce6;
        --cp-border-strong: #b7c5d5;
        --cp-text: #17213a;
        --cp-text-muted: #52617a;
        --cp-text-soft: #6d7c93;
        --cp-accent: #083b63;
        --cp-accent-hover: #062d4c;
        --cp-accent-soft: #eaf0f5;
        --cp-link: #064c86;
        --cp-success: #166534;
        --cp-success-soft: #f0fdf4;
        --cp-success-border: #bbf7d0;
        --cp-danger: #b42318;
        --cp-danger-soft: #fef2f2;
        --cp-danger-border: #fecaca;
        --cp-warning: #92400e;
        --cp-warning-soft: #fffbeb;
        --cp-warning-border: #fde68a;
      }
      html[data-theme="dark"] {
        --cp-bg: #151c27;
        --cp-bg-elevated: #192230;
        --cp-surface: #1d2838;
        --cp-surface-soft: #243449;
        --cp-border: #354860;
        --cp-border-strong: #5b7391;
        --cp-text: #e5edf6;
        --cp-text-muted: #b0c0d3;
        --cp-text-soft: #9aadc5;
        --cp-accent: #a7cfee;
        --cp-accent-hover: #c2e1f8;
        --cp-accent-soft: #23364a;
        --cp-accent-fg: #142131;
        --cp-link: #a7d4ff;
        --cp-success: #86efac;
        --cp-success-soft: #1d342a;
        --cp-success-border: #38644b;
        --cp-danger: #fca5a5;
        --cp-danger-soft: #38242b;
        --cp-danger-border: #74444d;
        --cp-warning: #fcd34d;
        --cp-warning-soft: #382f1e;
        --cp-warning-border: #736139;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; line-height: 1.5; }
      #root { display: flex; flex-direction: column; min-height: 100vh; }
      button, input, select, textarea { font: inherit; }
      button, a, input, select, textarea { outline-offset: 4px; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--cp-accent); }
      a { color: var(--cp-link); }
      button { cursor: pointer; padding: 10px 16px; border: 1px solid var(--cp-border-strong); border-radius: 0.625rem; background: var(--cp-surface); color: var(--cp-accent); font-weight: 600; }
      button:hover { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      button.primary { border-color: var(--cp-accent); background: var(--cp-accent); color: var(--cp-accent-fg); }
      button.primary:hover:not(:disabled) { background: var(--cp-accent-hover); }
      button.danger { color: var(--cp-danger); border-color: var(--cp-danger-border); }
      button.danger:hover { background: var(--cp-danger-soft); }
      .page-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 40px; border-bottom: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
      .brand { display: flex; align-items: center; gap: 20px; min-width: 0; }
      .mark { display: grid; place-items: center; flex-shrink: 0; width: 52px; height: 52px; border-radius: 0.625rem; background: var(--cp-accent); color: var(--cp-accent-fg); font: 700 22px Georgia, "Times New Roman", serif; }
      .brand strong { color: var(--cp-accent); font: 700 32px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -0.5px; }
      .brand small { display: block; margin-top: 4px; color: var(--cp-text-muted); font: 16px/1.4 Georgia, "Times New Roman", serif; }
      .header-actions { display: flex; align-items: center; gap: 20px; font-size: 14px; }
      .header-identity { color: var(--cp-text-muted); }
      .header-actions a { white-space: nowrap; }
      .portal-main { flex: 1; width: 100%; max-width: 1120px; min-width: 0; margin: 0 auto; padding: 32px 40px 40px; }
      .page-intro { margin-bottom: 28px; }
      .eyebrow { color: var(--cp-accent); font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      h1, h2, h3 { color: var(--cp-accent); font-family: Georgia, "Times New Roman", serif; }
      h1 { margin: 8px 0 12px; font-size: clamp(30px, 4vw, 40px); font-weight: 600; letter-spacing: -0.75px; line-height: 1.2; }
      .page-intro p { margin: 0; max-width: 720px; color: var(--cp-text-muted); font: 18px/1.6 Georgia, "Times New Roman", serif; }
      h2 { margin: 0 0 12px; font-size: 25px; line-height: 1.3; }
      .portal-panel { margin-bottom: 24px; padding: 24px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
      .portal-panel p { color: var(--cp-text-muted); }
      .pedagogy-controls { display: grid; gap: 16px; margin-top: 16px; }
      .control-description { margin: 8px 0 0; max-width: 72ch; font-size: 14px; line-height: 1.5; }
      .pedagogy-guide { border: 2px solid var(--cp-accent); border-top-width: 6px; background: var(--cp-accent-soft); }
      .pedagogy-guide h2 { margin: 8px 0; }
      .pedagogy-guide-intro { margin: 0 0 20px; }
      .pedagogy-guide-styles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .pedagogy-guide-style { padding: 16px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-surface); }
      .pedagogy-guide h3 { margin: 0 0 8px; font-size: 18px; }
      .pedagogy-guide-style p, .pedagogy-guide-citations p { margin: 0; font-size: 14px; }
      .pedagogy-guide-citations { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--cp-border-strong); }
      .pedagogy-dialog { width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; padding: 24px; border: 1px solid var(--cp-border-strong); border-radius: 16px; background: var(--cp-surface); color: var(--cp-text); }
      .pedagogy-dialog::backdrop { background: var(--cp-overlay); }
      .pedagogy-dialog textarea { display: block; width: 100%; margin-top: 8px; padding: 12px; resize: vertical; border: 1px solid var(--cp-border-strong); border-radius: 0.625rem; background: var(--cp-surface); color: var(--cp-text); }
      .pedagogy-dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
      .identity-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      label { color: var(--cp-text); }
      :where(input:not([type="checkbox"]):not([type="file"]), select) { display: block; width: 100%; min-width: 0; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--cp-border-strong); border-radius: 0.625rem; background: var(--cp-surface); color: var(--cp-text); }
      input[readonly] { background: var(--cp-surface-soft); color: var(--cp-text-muted); }
      input[type="checkbox"] { width: 16px; height: 16px; margin: 0 8px 0 0; vertical-align: middle; accent-color: var(--cp-accent); }
      input[type="file"] { width: 100%; padding: 16px; border: 1px dashed var(--cp-border-strong); border-radius: 0.625rem; background: var(--cp-bg-elevated); color: var(--cp-text-muted); }
      input[type="file"]::file-selector-button { margin-right: 12px; padding: 8px 12px; border: 1px solid var(--cp-border-strong); border-radius: 0.625rem; background: var(--cp-surface); color: var(--cp-accent); font: inherit; cursor: pointer; }
      .upload-options { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 16px 0; padding: 12px 16px; border: 1px solid var(--cp-border); border-radius: 0.625rem; background: var(--cp-bg-elevated); }
      .upload-options legend { padding: 0 4px; color: var(--cp-text-muted); font-size: 13px; }
      .upload-options label { color: var(--cp-text-soft); cursor: not-allowed; }
      .upload-options input { opacity: 0.55; cursor: not-allowed; }
      .upload-options p { flex-basis: 100%; margin: 0; font-size: 12px; }
      .demo-badge { display: inline-block; margin-left: 6px; padding: 2px 6px; border: 1px solid var(--cp-border-strong); border-radius: 6px; background: var(--cp-accent-soft); color: var(--cp-accent); font-size: 11px; font-weight: 600; }
      .section-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
      .section-heading h2 { margin: 0; }
      .course-group { margin-top: 16px; padding: 20px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-bg-elevated); }
      .group-heading { display: flex; gap: 12px; align-items: center; }
      .group-heading input { flex: 1; margin-top: 0; font-weight: 600; }
      .course-tag { display: inline-flex; align-items: center; flex-wrap: wrap; max-width: 100%; gap: 6px; padding: 6px 10px; border-radius: 0.625rem; background: var(--cp-accent-soft); color: var(--cp-accent); font-size: 14px; overflow-wrap: anywhere; }
      .course-tag button { padding: 2px 4px; border: 0; background: none; color: var(--cp-accent); line-height: 1; }
      .course-entry { display: grid; grid-template-columns: 120px minmax(0, 1fr) 44px; gap: 8px; margin-top: 12px; }
      .course-entry input { margin-top: 0; }
      .course-entry button { padding: 0; font-size: 24px; line-height: 1; }
      .site-footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 20px 40px; border-top: 1px solid var(--cp-border); color: var(--cp-text-soft); font-size: 12px; }
      .site-footer strong { color: var(--cp-accent); }
      @media (max-width: 680px) {
        .page-header { align-items: start; flex-wrap: wrap; gap: 16px; padding: 20px; }
        .brand { gap: 12px; }
        .brand strong { font-size: 26px; }
        .brand small { font-size: 14px; }
        .mark { width: 48px; height: 48px; }
        .header-actions { width: 100%; justify-content: space-between; }
        .portal-main { padding: 24px 16px; }
        .portal-panel { padding: 20px 16px; }
        .pedagogy-guide-styles { grid-template-columns: minmax(0, 1fr); }
        .identity-fields { grid-template-columns: minmax(0, 1fr); }
        .course-group { padding: 16px 12px; }
        .group-heading { gap: 8px; }
        .group-heading button { padding: 10px; }
        .course-entry { grid-template-columns: minmax(0, 1fr) 44px; }
        .course-entry [data-role="course-id"] { grid-column: 1 / -1; }
        .site-footer { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
