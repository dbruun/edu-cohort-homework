<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homework Tutor — End-to-End Architecture</title>
<style>
  :root {
    --bg: #0b1220;
    --ink: #e8eefc;
    --muted: #9fb0d0;
    --lms: #4f8cff;
    --lti: #22c1a5;
    --bridge: #f2a33c;
    --agent: #b06cff;
    --search: #ff6b8b;
    --data: #38bdf8;
    --prof: #f4c04e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(1200px 800px at 50% -10%, #17233f 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px 64px; }
  header { text-align: center; margin-bottom: 6px; }
  header h1 { font-size: 28px; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  .svg-card {
    margin-top: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  svg { width: 100%; height: auto; display: block; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: center;
    margin-top: 22px; color: var(--muted); font-size: 13px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 26px; height: 0; border-top-width: 3px; border-top-style: solid; display: inline-block; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Homework Tutor — End-to-End Architecture</h1>
      <p>LMS launches the tutor over LTI, the bridge streams to a Foundry agent grounded in Azure AI Search, kept fresh by a periodic sync and professor-authored pedagogy.</p>
    </header>

    <div class="svg-card">
      <svg viewBox="0 0 1240 720" role="img" aria-label="End-to-end architecture diagram">
        <defs>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
          </filter>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#c3d0ee"/>
          </marker>
          <marker id="ah-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--data)"/>
          </marker>
          <marker id="ah-prof" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--prof)"/>
          </marker>
        </defs>

        <style>
          .box { fill:#111a2e; stroke-width:2; }
          .title { font-size:15px; font-weight:700; fill:#e8eefc; }
          .sub { font-size:11px; fill:#9fb0d0; }
          .tag { font-size:10.5px; font-weight:700; letter-spacing:.4px; }
          .edge { stroke:#c3d0ee; stroke-width:2.4; fill:none; }
          .edge-label { font-size:11px; fill:#c3d0ee; font-weight:600; }
          .lane { font-size:12px; font-weight:700; fill:#6f80a4; letter-spacing:1.2px; }
        </style>

        <!-- lane guides -->
        <text x="30" y="70"  class="lane">LMS</text>
        <text x="30" y="250" class="lane">DELIVERY</text>
        <text x="30" y="470" class="lane">RUNTIME</text>
        <text x="30" y="650" class="lane">KNOWLEDGE</text>

        <!-- ============ LMS ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="120" y="40" width="230" height="96" rx="14" stroke="var(--lms)"/>
        </g>
        <text x="140" y="66" class="tag" fill="var(--lms)">LMS PLATFORM</text>
        <text x="140" y="90" class="title">Canvas / Blackboard</text>
        <text x="140" y="110" class="sub">LTI 1.3 platform · course roster</text>
        <text x="140" y="126" class="sub">Learner &amp; instructor launch</text>

        <!-- ============ LTI TOOL ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="120" y="200" width="230" height="110" rx="14" stroke="var(--lti)"/>
        </g>
        <text x="140" y="226" class="tag" fill="var(--lti)">LTI 1.3 TOOL · ltijs</text>
        <text x="140" y="250" class="title">Launch &amp; role routing</text>
        <text x="140" y="270" class="sub">OIDC login · id_token validate</text>
        <text x="140" y="286" class="sub">Learner → tutor · Instructor → portal</text>
        <text x="140" y="302" class="sub">Cosmos DB (Mongo) state</text>

        <!-- ============ BRIDGE ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="470" y="410" width="240" height="120" rx="14" stroke="var(--bridge)"/>
        </g>
        <text x="490" y="436" class="tag" fill="var(--bridge)">AG-UI BRIDGE · FastAPI</text>
        <text x="490" y="460" class="title">Chat streaming bridge</text>
        <text x="490" y="480" class="sub">SSE / AG-UI protocol</text>
        <text x="490" y="496" class="sub">Invokes agent by name</text>
        <text x="490" y="512" class="sub">(FoundryAgent · backend-agnostic)</text>

        <!-- ============ STUDENT CHAT UI ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="120" y="410" width="230" height="120" rx="14" stroke="var(--lti)"/>
        </g>
        <text x="140" y="436" class="tag" fill="var(--lti)">STUDENT CHAT UI</text>
        <text x="140" y="460" class="title">Tutor chat page</text>
        <text x="140" y="480" class="sub">Served on learner launch</text>
        <text x="140" y="496" class="sub">Speaks AG-UI stream directly</text>
        <text x="140" y="512" class="sub">Guided answers + citations</text>

        <!-- ============ FOUNDRY AGENT ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="800" y="400" width="250" height="140" rx="14" stroke="var(--agent)"/>
        </g>
        <text x="820" y="426" class="tag" fill="var(--agent)">FOUNDRY HOSTED AGENT</text>
        <text x="820" y="450" class="title">Homework Tutor</text>
        <text x="820" y="470" class="sub">.NET · Agent Framework</text>
        <text x="820" y="486" class="sub">Pedagogy guardrails in prompt</text>
        <text x="820" y="502" class="sub">Grounds via Toolbox → Search</text>
        <line x1="820" y1="514" x2="1030" y2="514" stroke="#33456b" stroke-width="1"/>
        <text x="820" y="530" class="sub">↳ Foundry model deployment</text>

        <!-- ============ AZURE AI SEARCH ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="800" y="600" width="250" height="96" rx="14" stroke="var(--search)"/>
        </g>
        <text x="820" y="626" class="tag" fill="var(--search)">AZURE AI SEARCH</text>
        <text x="820" y="650" class="title">Course knowledge base</text>
        <text x="820" y="670" class="sub">Index · knowledge source</text>
        <text x="820" y="686" class="sub">Retrieval + citations</text>

        <!-- ============ DATA INTEGRATION (TIMER) ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="470" y="600" width="240" height="96" rx="14" stroke="var(--data)"/>
        </g>
        <text x="490" y="626" class="tag" fill="var(--data)">DATA INTEGRATION</text>
        <text x="490" y="650" class="title">Periodic sync job</text>
        <text x="490" y="670" class="sub">⏱ Timer-triggered</text>
        <text x="490" y="686" class="sub">Course docs / LMS content → index</text>

        <!-- ============ PROFESSOR PEDAGOGY ============ -->
        <g filter="url(#soft)">
          <rect class="box" x="1090" y="600" width="120" height="96" rx="14" stroke="var(--prof)"/>
        </g>
        <text x="1150" y="626" class="tag" fill="var(--prof)" text-anchor="middle">PROFESSOR</text>
        <text x="1150" y="650" class="title" text-anchor="middle">Pedagogy</text>
        <text x="1150" y="670" class="sub" text-anchor="middle">Portal edits</text>
        <text x="1150" y="686" class="sub" text-anchor="middle">Help level, rules</text>

        <!-- ================= EDGES ================= -->

        <!-- LMS -> LTI tool : LTI launch -->
        <path class="edge" d="M235 136 V200" marker-end="url(#ah)"/>
        <text x="245" y="172" class="edge-label">LTI 1.3 launch (OIDC)</text>

        <!-- LTI tool -> Student UI : learner route -->
        <path class="edge" d="M235 310 V410" marker-end="url(#ah)"/>
        <text x="245" y="365" class="edge-label">learner route</text>

        <!-- Student UI -> Bridge : AG-UI stream -->
        <path class="edge" d="M350 470 H470" marker-end="url(#ah)"/>
        <text x="360" y="458" class="edge-label">AG-UI / SSE</text>

        <!-- Bridge -> Agent : invoke -->
        <path class="edge" d="M710 470 H800" marker-end="url(#ah)"/>
        <text x="718" y="458" class="edge-label">invoke</text>

        <!-- Agent -> Search : retrieval -->
        <path class="edge" d="M925 540 V600" marker-end="url(#ah)"/>
        <text x="935" y="576" class="edge-label">retrieve / ground</text>

        <!-- Data integration -> Search : periodic feed -->
        <path class="edge" d="M710 648 H800" stroke="var(--data)" marker-end="url(#ah-data)"/>
        <text x="712" y="636" class="edge-label" fill="var(--data)">index refresh</text>

        <!-- Professor pedagogy -> Search : directly updates index -->
        <path class="edge" d="M1090 648 H1050" stroke="var(--prof)" marker-end="url(#ah-prof)"/>
        <text x="1052" y="636" class="edge-label" fill="var(--prof)" text-anchor="end">directly updates index</text>
      </svg>
    </div>

    <div class="legend">
      <span><i class="swatch" style="border-top-color:#c3d0ee"></i>Request / launch path</span>
      <span><i class="swatch" style="border-top-color:var(--data)"></i>Periodic data integration</span>
      <span><i class="swatch" style="border-top-color:var(--prof)"></i>Professor pedagogy → index</span>
    </div>
  </div>
</body>
</html>
