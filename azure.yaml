# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: edu-homework-accelerator
metadata:
    template: edu-homework-accelerator@0.1.0
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
    course-knowledge:
        host: azure.ai.toolbox
        uses:
            - ai-project
        tools:
            # Curated course-knowledge grounding for the tutor. References an existing
            # CognitiveSearch project connection (course-knowledge-connection) over the
            # course-materials index. Create the connection once before first deploy:
            #   azd ai connection create course-knowledge-connection \
            #     --kind cognitive-search --target "https://<search>.search.windows.net/" \
            #     --auth-type api-key --key "<admin-key>"
            - type: azure_ai_search
              name: course-search
              azure_ai_search:
                indexes:
                    - project_connection_id: course-knowledge-connection
                      index_name: course-materials
                      query_type: vector_semantic_hybrid
                      top_k: 5
    homework-agent:
        project: ./src/HomeworkAgent
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
            - course-knowledge
        codeConfiguration:
            entryPoint: HomeworkAgent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: An EDU homework tutor hosted on Microsoft Foundry that gives guided, pedagogy-aware support to students, preferring hints and step-by-step explanations over direct answers and grounding responses in approved course knowledge.
        displayName: EDU Homework Tutor
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: PEDAGOGY_POLICY_URI
              value: ${PEDAGOGY_POLICY_URI}
            - name: TOOLBOX_NAME
              value: course-knowledge
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Agent Framework
                - .NET
        name: homework-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
