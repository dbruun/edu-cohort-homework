# Reference copy of the course-knowledge toolbox. The DEPLOYED toolbox is declared as the
# `course-knowledge` host: azure.ai.toolbox service in ../azure.yaml (that is the source of
# truth `azd deploy` provisions). Keep this file in sync for documentation purposes.
name: homework-toolbox
description: Curated knowledge access for the EDU homework tutor.
tools:
  - type: azure_ai_search
    name: course-search
    description: Search course-specific knowledge and assignment guidance.
    azure_ai_search:
      indexes:
        - index_name: course-materials
          project_connection_id: course-knowledge-connection
          query_type: vector_semantic_hybrid
          top_k: 5
